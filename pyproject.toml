[project]
name = "paperops-agent"
version = "0.1.0"
description = "A durable workflow for parsing, validating, chunking, and retrieving research papers."
maintainers = [
    { name = "oranchpekoe" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlite-vec>=0.1.7",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
retrieval-models = [
    "fastembed>=0.8.0,<0.9.0",
]

[project.scripts]
paperops-api = "paperops.api.app:run"
paperops-eval = "paperops.evaluation.cli:main"

[project.urls]
Repository = "https://github.com/oranchpekoe/paperops-agent"
Upstream = "https://github.com/langchain-ai/react-agent"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["paperops*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
    # Module-level imports after environment/logging setup are intentional.
    "E402",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP", "T201"]
"src/paperops/evaluation/cli.py" = ["T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# CVE-2026-32597: pyjwt < 2.12.0 accepts unknown `crit` header extensions.
# Transitive via langgraph-api -> pyjwt. Remove once langgraph-api requires pyjwt>=2.12.0.
constraint-dependencies = ["pyjwt>=2.12.0"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.10",
    "mypy>=1.11.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.1",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (API keys, Chroma, LLM).",
]
